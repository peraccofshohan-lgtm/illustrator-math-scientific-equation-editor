name: Release

# Builds the single-file JSX, runs the full test suite, verifies that the
# committed asset matches the sources, then publishes a GitHub Release with
# the asset attached. Tags containing "-" (e.g. v1.0.0-rc.1) are published as
# pre-releases. Release notes come from release/notes/<tag>.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Build and test
        run: npm test
      - name: Verify committed asset is current and ES3-valid
        run: node tools/build.js --check
      - name: Check version matches tag
        run: |
          v="$(node -p "require('./package.json').version")"
          test "v$v" = "$GITHUB_REF_NAME" || { echo "package.json version v$v does not match tag $GITHUB_REF_NAME"; exit 1; }
          grep -q "MSEE.VERSION = '$v';" release/Shohan_Khan_Illustrator_Math_Scientific_Equation_Editor.jsx
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          notes="release/notes/$tag.md"
          test -f "$notes" || { echo "Missing $notes"; exit 1; }
          title="Adobe Illustrator Advanced Mathematical & Scientific Equation Editor $tag"
          flags=""
          case "$tag" in *-*) flags="--prerelease" ;; esac
          gh release create "$tag" release/Shohan_Khan_Illustrator_Math_Scientific_Equation_Editor.jsx \
            --title "$title" --notes-file "$notes" --verify-tag $flags
      - name: Verify uploaded asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/dl
          gh release download "$GITHUB_REF_NAME" --dir /tmp/dl
          cmp /tmp/dl/Shohan_Khan_Illustrator_Math_Scientific_Equation_Editor.jsx release/Shohan_Khan_Illustrator_Math_Scientific_Equation_Editor.jsx
          ls -l /tmp/dl
